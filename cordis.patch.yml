# dsh-project-lead bundle patch (mount-only).
#
# This patch does NOT modify any @deepseek-ai harness internal entry.
# It only inserts this plugin's own code line into the profile's layer
# stack, so `dsh plugin --profile <name> add dsh-project-lead`
# loads it as a live profile layer.
#
# User-tunable configuration: third-party model routes, the sub-agent allow-list,
# the plugin config (`prompts`, `subagent`, `modelNotes`), and the PM preset.
# Use the Web Settings/Plugins pages or the profile patch; see examples/ in this
# package for file forms.
- insert:
    - id: project-lead
      name: dsh-project-lead
