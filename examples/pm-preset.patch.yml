# Optional Project Manager preset (方案 A)
# ==========================================
#
# This is a one-time profile patch. Standard remains the default:
#   - choose "Project Manager" for project sessions that should delegate;
#   - keep Standard for small tools or quick tasks that do not need splitting.
#
# The PM keeps `read` / `read_image`, loses `write` / `edit`, and has no shell
# (`pwsh` / `bash`). Children use the Standard preset and keep code tools.
#
# Install by appending the `insert` entry below to
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml
# Then pick the preset in the new-session picker or Settings → Agent Presets.
#
# Adjust `agentOptions` to your cheap child route. Add `tool-fs-search` below
# only if you want the PM itself to glob/grep; otherwise it asks a Scout.

- insert:
    - id: preset-pm
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pm
        order: 0
        name: Project Manager
        description: PM that delegates implementation; read-only file access, no write/edit/shell.
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # Keep read/read_image; omit write and edit from this preset.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  # Children use the code-capable Standard preset, not the PM
                  # preset. Change this if your project uses ptc/cordis instead.
                  agentPreset: standard
                  # Default cheap child route; adjust to your provider/model.
                  agentOptions:
                    provider: commandcode
                    model: deepseek/deepseek-v4.1-flash

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
