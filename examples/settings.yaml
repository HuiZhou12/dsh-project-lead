# LEGACY 0.1.x settings.yaml — MIGRATION REFERENCE ONLY
# =====================================================
#
# Do NOT use this file for a new DeepSeek Harness 0.2.x install.
# The current format is the profile patch: see examples/cordis.patch.yml.
#
# What 0.2.x does with a leftover settings.yaml:
#   * At startup it imports each section ONCE into the profile entry with the
#     same id, then renames the file to settings.yaml.imported.
#   * Edits made after that import are ignored.
#   * A section whose id is not a live profile entry is logged and left only
#     in the renamed file; it no longer configures anything.
#
# Section-by-section:
#   llm-pi-ai:                    imported once into the `llm-pi-ai` row.
#   project-lead:     imported once into the plugin row, if mounted.
#   subagent-model-selection:     NOT a valid 0.2.x entry id; dropped.
#                                 Migrate it to
#                                 `subagent-model-selection-settings` in the
#                                 profile patch (or the Web Plugins page).
#
# 0.1.x also had a foreground/background delegation switch. It no longer
# exists: `subagent` is always asynchronous and reports through completion
# notices.
#
# The original 0.1.x shape is kept below as comments so it is inert even if
# this file is accidentally copied into $DSH_HOME.
#
# ── 1) Third-party routes (old shape) ────────────────────────────────────────
# llm-pi-ai:
#   providers:
#     glm:
#       displayName: Zhipu GLM
#       apiKeyEnv: GLM_API_KEY
#       api: openai-completions
#       baseURL: https://open.bigmodel.cn/api/paas/v4
