# Optional Project Manager preset with shell (方案 B, ops variant)
# =================================================================
#
# Same delegation boundary as pm-preset.patch.yml, but the PM keeps a
# platform-appropriate shell (`pwsh` on Windows, `bash` elsewhere). Use this
# variant when you want per-package git worktree isolation for parallel
# implementation packages:
#
#   git worktree add .worktrees/<id> -b project-lead/<id>
#
# The bundled PM prompt narrows shell use to worktree management (`git
# worktree add/remove/prune/list` and one `.git/info/exclude` line) — but a
# shell can technically write files, so "the PM never writes code" becomes a
# prompt rule instead of a hard tool boundary. `write` / `edit` tools stay
# hard-disabled. If you do not need worktree isolation, prefer the stricter
# pm-preset.patch.yml.
#
# Install by appending the `insert` entry below to
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml
# Then pick the preset in the new-session picker or Settings → Agent Presets.
#
# Adjust `agentOptions` to your cheap child route. The `shell` capability of
# dsh-project-lead detects `pwsh` / `bash` automatically and injects the
# worktree procedure into the PM prompt.

- insert:
    - id: preset-pm-ops
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pm-ops
        order: 0
        name: Project Manager (Ops)
        description: PM that delegates implementation; read-only files plus shell for worktree management (write/edit still off).
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # Keep read/read_image; write and edit stay excluded from this preset.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false

          # Shell for worktree management only (see the prompt boundary);
          # each platform keeps exactly one, matching the Standard preset.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  # Children use the code-capable Standard preset, not the PM
                  # preset. Change this if your project uses ptc/cordis instead.
                  agentPreset: standard
                  # Default cheap child route; adjust to your provider/model.
                  agentOptions:
                    provider: commandcode
                    model: deepseek/deepseek-v4.1-flash

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
