# DeepSeek Harness 0.2.x profile patch example
# =============================================
#
# This example targets the Web profile, whose agent presets provide the
# preset-scoped delegation row that child model selection requires.
#
# Copy the entries you need into:
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml
#
# The file is a top-level YAML sequence of patch entries. An entry addressed by
# `id` replaces the corresponding row's supplied fields; `config:` is replaced
# wholesale, not deep-merged. Keep your existing values when you merge.
#
# The plugin bundle already inserts its own `project-lead` row.
# Do not add an `insert:` entry for it here.
#
# Replacement routes are ordinary `llm-pi-ai` providers. The Web **Models** page
# writes the same shape; use one or the other, not both with different values.

# ── 1) Third-party OpenAI-compatible model routes ────────────────────────────
- id: llm-pi-ai
  config:
    providers:
      glm:
        displayName: Zhipu GLM
        apiKeyEnv: GLM_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/paas/v4
        models:
          - id: glm-4.6
            name: GLM-4.6
            contextWindow: 200000
          - id: glm-4.5-air
            name: GLM-4.5-Air
            contextWindow: 128000
          - id: glm-4-flash
            name: GLM-4-Flash
            contextWindow: 128000
      kimi:
        displayName: Moonshot Kimi
        apiKeyEnv: KIMI_API_KEY
        api: openai-completions
        baseURL: https://api.moonshot.cn/v1
        models:
          - id: kimi-k2-0711-preview
            name: Kimi K2
            contextWindow: 128000
      qwen:
        displayName: Alibaba Qwen
        apiKeyEnv: DASHSCOPE_API_KEY
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        models:
          - id: qwen-max
            name: Qwen-Max
            contextWindow: 128000
          - id: qwen-turbo
            name: Qwen-Turbo
            contextWindow: 131072

# ── 2) Authorize routes for child agents ─────────────────────────────────────
# `enabled` and a non-empty `allowedModels` are both required. Only these exact
# provider/model pairs can be selected by the delegation tool.
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - { provider: glm, model: glm-4.6 }
      - { provider: glm, model: glm-4-flash }
      - { provider: kimi, model: kimi-k2-0711-preview }
      - { provider: qwen, model: qwen-max }
      - { provider: qwen, model: qwen-turbo }

# ── 3) Model-facing selection on the delegation tool ─────────────────────────
# This must live on a delegation row inside an agent-preset scope. The shipped
# Web standard/ptc/cordis presets already set it, so Web users normally skip
# this block. A host-level row in a direct-agent/headless composition is
# rejected by 0.2.1 with:
#   "standing modelSelectionSettings requires a scoped preset Context"
# The forked delegation tool intentionally has no model selection.
#
# - id: tool-subagent
#   config:
#     provider: spawn
#     toolName: subagent
#     modelSelectionSettings: true

# ── 4) Project Manager prompt + model notes ──────────────────────────────────
# Prefer **Settings → 项目编排** for these values; this YAML is the equivalent
# file form for automation or profiles without the Settings UI.
# Project facts live in AGENTS.md, README, and project skills; the PM reads them
# or dispatches a Scout. The UI no longer exposes a project profile.
- id: project-lead
  config:
    prompts:
      main: compact            # compact | full | guidance | off (PM preset only for compact/full)
      pmPreset: pm             # the preset that receives the PM prompt; empty = all
      otherMain: guidance      # Standard/other sessions: guidance | off
      childRoles: true
      defaultChildRole: executor
      roleMarker: ROLE
      # dir: /optional/path/to/custom/prompts   # same 00-08 filenames
    subagent:
      provider: glm            # the default route the PM passes to children
      model: glm-4-flash
      reasoningEffort: ""      # empty = do not pass an effort
    modelNotes:
      glm/glm-4.6:
        description: Zhipu flagship, strong reasoning.
        strengths: complex reasoning, coding, agentic tool use, long context
        weaknesses: slower and pricier
      glm/glm-4-flash:
        description: Zhipu fast model.
        strengths: fast and cheap for simple high-volume work
        weaknesses: weak reasoning, not for complex tasks
      kimi/kimi-k2-0711-preview:
        description: Kimi K2, strong reasoning and long context.
        strengths: long context, complex reasoning, agentic
        weaknesses: slower and pricier
      qwen/qwen-max:
        description: Alibaba flagship.
        strengths: strong reasoning, multilingual, agentic
        weaknesses: slower and pricier
      qwen/qwen-turbo:
        description: Alibaba fast tier.
        strengths: fast and cheap for high-volume simple work
        weaknesses: weaker on complex reasoning
